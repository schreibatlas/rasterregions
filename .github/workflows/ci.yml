name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" -r docs/requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python examples/rasterregions_examples/run_all_examples.py
      - run: python docs/make.py html
      - run: python -m mypy rasterregions
      - run: python -m build
      - name: Install built wheel in an isolated environment
        run: |
          python -m venv /tmp/rasterregions-wheel
          /tmp/rasterregions-wheel/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed wheel
        working-directory: /tmp
        run: >-
          /tmp/rasterregions-wheel/bin/python -c
          "import rasterregions; from PIL import Image; import numpy;
          assert rasterregions.detect_regions(Image.new('RGB', (20, 20), 'white')).status == 'failed'"
