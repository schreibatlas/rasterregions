name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and documentation dependencies
        run: python -m pip install -e ".[dev]" -r docs/requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - name: Run canonical examples
        run: python examples/run_all.py
      - name: Check generated documentation images
        run: python docs/generate_visual_examples.py --check
      - name: Build strict Sphinx documentation
        run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
      - run: python -m mypy rasterregions
      - name: Build and inspect wheel and sdist
        run: |
          rm -rf dist
          python -m build --sdist --wheel
          python -m twine check dist/*
          python scripts/check_artifacts.py dist
      - name: Install wheel and sdist in clean environments
        run: |
          python -m venv /tmp/rasterregions-wheel
          /tmp/rasterregions-wheel/bin/python -m pip install dist/*.whl
          python -m venv /tmp/rasterregions-sdist
          /tmp/rasterregions-sdist/bin/python -m pip install dist/*.tar.gz
      - name: Smoke-test installed wheel and sdist
        working-directory: /tmp
        run: |
          for environment in /tmp/rasterregions-wheel /tmp/rasterregions-sdist; do
            "$environment/bin/rasterregions" --version
            "$environment/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          done

  inkgrammar-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build a release-version wheel for consumer testing
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.1.0"
        run: |
          python -m pip install build
          mkdir -p /tmp/rasterregions-consumer
          python -m build --wheel --outdir /tmp/rasterregions-consumer
          python -m pip install /tmp/rasterregions-consumer/*.whl
      - uses: actions/checkout@v4
        with:
          repository: buchwandler/inkgrammar
          path: inkgrammar
          fetch-depth: 0
      - name: Install InkGrammar against the built rasterregions wheel
        working-directory: inkgrammar
        run: python -m pip install -e ".[dev,fit]"
      - name: Run InkGrammar consumer tests
        working-directory: inkgrammar
        run: python -m pytest -q
